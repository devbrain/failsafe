name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GCC
          - os: ubuntu-latest
            compiler: gcc
            version: 11
          - os: ubuntu-latest
            compiler: gcc
            version: 13

          # Ubuntu 24.04 provides both Clang versions; newer images may drop them.
          - os: ubuntu-24.04
            compiler: clang
            version: 17
          - os: ubuntu-24.04
            compiler: clang
            version: 18

          # macOS
          - os: macos-15
            compiler: apple-clang

          # Windows MSVC
          - os: windows-latest
            compiler: msvc

          # Windows Clang-CL
          - os: windows-latest
            compiler: clang-cl

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} - ${{ matrix.compiler }}${{ matrix.version && format(' {0}', matrix.version) || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler (Linux GCC)
        if: runner.os == 'Linux' && matrix.compiler == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-${{ matrix.version }}
          echo "CC=gcc-${{ matrix.version }}" >> $GITHUB_ENV
          echo "CXX=g++-${{ matrix.version }}" >> $GITHUB_ENV

      - name: Select compiler (Linux Clang)
        if: runner.os == 'Linux' && matrix.compiler == 'clang'
        run: |
          LLVM_VERSION=${{ matrix.version }}
          clang-${LLVM_VERSION} --version
          clang++-${LLVM_VERSION} --version
          echo "CC=clang-${LLVM_VERSION}" >> $GITHUB_ENV
          echo "CXX=clang++-${LLVM_VERSION}" >> $GITHUB_ENV

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEUTRINO_FAILSAFE_BUILD_TESTS=ON \
            -DNEUTRINO_FAILSAFE_INSTALL=OFF

      - name: Configure CMake (Windows MSVC)
        if: runner.os == 'Windows' && matrix.compiler == 'msvc'
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DNEUTRINO_FAILSAFE_BUILD_TESTS=ON `
            -DNEUTRINO_FAILSAFE_INSTALL=OFF

      - name: Configure CMake (Windows Clang-CL)
        if: runner.os == 'Windows' && matrix.compiler == 'clang-cl'
        run: |
          cmake -B build `
            -T ClangCL `
            -DCMAKE_BUILD_TYPE=Release `
            -DNEUTRINO_FAILSAFE_BUILD_TESTS=ON `
            -DNEUTRINO_FAILSAFE_INSTALL=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure

  debug:
    runs-on: ubuntu-latest
    name: Ubuntu - GCC 13 (Debug)

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNEUTRINO_FAILSAFE_BUILD_TESTS=ON \
            -DNEUTRINO_FAILSAFE_INSTALL=OFF

      - name: Build
        run: cmake --build build --config Debug

      - name: Run tests
        run: ctest --test-dir build --build-config Debug --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    name: Ubuntu - Clang 18 (ASan + UBSan)

    steps:
      - uses: actions/checkout@v4

      - name: Select compiler
        run: |
          clang-18 --version
          clang++-18 --version
          echo "CC=clang-18" >> $GITHUB_ENV
          echo "CXX=clang++-18" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DNEUTRINO_FAILSAFE_BUILD_TESTS=ON \
            -DNEUTRINO_FAILSAFE_INSTALL=OFF

      - name: Build
        run: cmake --build build --config Debug

      - name: Run tests
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --build-config Debug --output-on-failure
